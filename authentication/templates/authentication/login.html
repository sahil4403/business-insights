<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Business Insights</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background: #f4f6f5;

            color: #1f2937;

        }


        .login-container {

            width: 100%;

            max-width: 420px;

            padding: 24px;

        }


        .login-card {

            background: white;

            border: 1px solid #e5e7eb;

            border-radius: 16px;

            padding: 34px;

            box-shadow:
                0 10px 30px
                rgba(0, 0, 0, 0.06);

        }


        .brand {

            text-align: center;

            margin-bottom: 28px;

        }


        .brand h1 {

            margin: 0;

            font-size: 26px;

            font-weight: 700;

            color: #16665a;

        }


        .brand p {

            margin: 8px 0 0;

            font-size: 14px;

            color: #6b7280;

        }


        .form-group {

            margin-bottom: 18px;

        }


        label {

            display: block;

            margin-bottom: 7px;

            font-size: 13px;

            font-weight: 600;

            color: #374151;

        }


        input {

            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

            transition: border-color 0.2s;

        }


        input:focus {

            border-color: #16665a;

        }


        .error {

            margin-bottom: 18px;

            padding: 11px 13px;

            border-radius: 8px;

            background: #fef2f2;

            color: #b91c1c;

            font-size: 13px;

        }


        button {

            width: 100%;

            border: none;

            border-radius: 9px;

            padding: 12px;

            background: #16665a;

            color: white;

            font-size: 14px;

            font-weight: 600;

            cursor: pointer;

        }


        button:hover {

            background: #125449;

        }


        .footer {

            text-align: center;

            margin-top: 20px;

            font-size: 12px;

            color: #9ca3af;

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="login-card">


        <div class="brand">

            <h1>
                Business Insights
            </h1>

            <p>
                Sign in to continue
            </p>

        </div>


        {% if form.errors %}

            <div class="error">

                Invalid username or password.

            </div>

        {% endif %}


        <form method="post">

            {% csrf_token %}


            <div class="form-group">
                <label for="id_username">
                    Username
                </label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    required
                >
            </div>

            <div class="form-group">
                <label for="id_password">
                    Password
                </label>
                <div style="position: relative; display: flex; align-items: center; width: 100%;">
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        autocomplete="current-password"
                        autocapitalize="none"
                        autocorrect="off"
                        spellcheck="false"
                        style="padding-right: 44px; width: 100%; box-sizing: border-box;"
                        required
                    >
                    <span onclick="togglePasswordVisibility('id_password', this)" style="position: absolute; right: 12px; cursor: pointer; user-select: none; -webkit-user-select: none; font-size: 18px; line-height: 1; z-index: 10; padding: 4px;" title="Show/Hide Password">👁️</span>
                </div>
            </div>

            <button type="submit">
                Sign In
            </button>

        </form>

        <script>
            function togglePasswordVisibility(inputId, span) {
                const input = document.getElementById(inputId);
                if (input.type === 'password') {
                    input.type = 'text';
                    span.innerHTML = '🙈';
                } else {
                    input.type = 'password';
                    span.innerHTML = '👁️';
                }
            }
        </script>

        <div style="margin-top: 20px; text-align: center; border-top: 1px dashed #e2e8f0; padding-top: 16px;">
            <a href="/management-portal-x99/login/?next=/management-portal-x99/" style="color: #475569; font-size: 13px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
                ⚙️ Login as Django Administration
            </a>
        </div>

    </div>


    <div class="footer">

        Business Insights Production System

    </div>


</div>


</body>

</html>
