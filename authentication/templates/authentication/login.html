<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login | Shri Raj Construction & Building Materials Supplier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#eef7f5',
                            100: '#d5ebe6',
                            500: '#16665a',
                            600: '#115248',
                            700: '#0d423a',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen flex items-center justify-center">

<div class="w-full max-w-md px-4 sm:px-6 py-8">

    <!-- BRAND HEADER -->
    <div class="text-center mb-6 md:mb-8">
        <div class="text-4xl mb-2">📊</div>
        <h1 class="text-2xl md:text-3xl font-bold text-brand-600 tracking-tight">Shri Raj Construction & Building Materials Supplier</h1>
        <p class="text-sm text-slate-500 mt-1.5">Sign in to continue</p>
    </div>

    <!-- LOGIN CARD -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 md:p-8">

        {% if form.errors %}
            <div class="mb-5 rounded-xl px-4 py-3 text-sm font-semibold bg-red-50 text-red-700 border border-red-200">
                Invalid username or password.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="mb-4 md:mb-5">
                <label for="id_username" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1.5">
                    Username
                </label>
                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    required
                    class="w-full h-14 px-4 rounded-xl border border-slate-300 bg-white text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition"
                >
            </div>

            <div class="mb-6">
                <label for="id_password" class="block text-[11px] font-bold text-slate-500 uppercase tracking-wide mb-1.5">
                    Password
                </label>
                <div class="relative flex items-center w-full">
                    <input
                        type="password"
                        name="password"
                        id="id_password"
                        autocomplete="current-password"
                        autocapitalize="none"
                        autocorrect="off"
                        spellcheck="false"
                        required
                        class="w-full h-14 pl-4 pr-12 rounded-xl border border-slate-300 bg-white text-sm text-slate-900 placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition"
                    >
                    <span onclick="togglePasswordVisibility('id_password', this)" title="Show/Hide Password" class="absolute right-3.5 cursor-pointer select-none text-xl leading-none z-10 p-1.5">
                        👁️
                    </span>
                </div>
            </div>

            <button type="submit" class="w-full h-14 rounded-xl bg-brand-500 hover:bg-brand-600 text-white font-bold text-base flex items-center justify-center gap-2 transition active:scale-[0.98] shadow-sm">
                Sign In
            </button>
        </form>

        <script>
            function togglePasswordVisibility(inputId, span) {
                const input = document.getElementById(inputId);
                if (input.type === 'password') {
                    input.type = 'text';
                    span.innerHTML = '🙈';
                } else {
                    input.type = 'password';
                    span.innerHTML = '👁️';
                }
            }
        </script>

        <div class="mt-6 text-center border-t border-dashed border-slate-200 pt-5">
            <a href="/management-portal-x99/login/?next=/management-portal-x99/" class="text-slate-600 text-[13px] font-semibold no-underline inline-flex items-center gap-1.5 active:text-brand-600">
                ⚙️ Login as Django Administration
            </a>
        </div>

    </div>

    <div class="text-center mt-6 text-xs text-slate-400">
        Shri Raj Construction & Building Materials Supplier Production System
    </div>

</div>

</body>
</html>
