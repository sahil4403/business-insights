{% extends 'base.html' %}

{% block title %}{{ page_title }}{% endblock %}

{% block scrolltopbar %}
<div class="flex items-center gap-2 px-3 py-2">
    <a href="{% if labour %}{% url 'labour:detail' labour.id %}{% else %}{% url 'labour:list' %}{% endif %}"
       class="shrink-0 h-9 px-3 rounded-lg border border-slate-300 bg-white text-slate-700 text-xs font-bold flex items-center gap-1 active:bg-slate-50">← Back</a>
    <span class="flex-1 truncate font-bold text-sm text-slate-800">{{ page_title }}</span>
</div>
{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
    <h1 class="text-2xl md:text-3xl font-extrabold text-slate-900 mb-4" data-animate>{{ page_title }}</h1>

    <form method="post" class="app-surface p-4 md:p-5 space-y-4" data-animate>
        {% csrf_token %}

        <div>
            <label class="label">Labour</label>
            {{ form.labour }}
        </div>

        <div>
            <label class="label">Date</label>
            {{ form.date }}
        </div>

        <div>
            <label class="label">Amount (₹)</label>
            {{ form.amount }}
        </div>

        <div>
            <label class="label">Note (optional)</label>
            {{ form.note }}
        </div>

        <div class="flex gap-2 pt-2">
            <a href="{% if labour %}{% url 'labour:detail' labour.id %}{% else %}{% url 'labour:list' %}{% endif %}" class="btn btn-ghost flex-1">Cancel</a>
            <button type="submit" class="btn btn-primary flex-1">Save</button>
        </div>
    </form>
</div>
{% endblock %}
